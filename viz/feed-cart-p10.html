<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 头原型投料车 · 设计图纸（A3 × 4）</title>
<style>
  :root{--ink:#1e2933;--muted:#5b6b76;--line:#c9d4dc;--bg:#e7ecef;--accent:#2d6b88;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
  .toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 28px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  .toolbar h1{font-size:16px;margin:0;letter-spacing:.4px}
  .toolbar h1 span{color:var(--muted);font-weight:400;margin-left:8px;font-size:13px}
  .toolbar .spacer{flex:1}
  .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn:hover{filter:brightness(1.06)}
  .hint{font-size:12px;color:var(--muted)}
  main{padding:10mm 0 16mm}
  .sheet{width:420mm;height:297mm;margin:0 auto 8mm;background:#fff;box-shadow:0 1.5mm 5mm rgba(20,40,55,.22);overflow:hidden}
  .sheet img{display:block;width:100%;height:100%}
  .cap{width:420mm;margin:-4mm auto 10mm;padding:0 2mm;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  @page{size:A3 landscape;margin:0}
  @media print{
    body{background:#fff}
    .toolbar,.cap{display:none}
    main{padding:0}
    .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page}
    .sheet:last-of-type{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>10 头原型投料车 · 设计图纸<span>A3 横版 · 4 张 · 目标原型投入 ≈ 3.2 万元</span></h1>
    <div class="spacer"></div>
    <span class="hint">打印：A3 横向 / 实际大小 / 无页边距</span>
    <button class="btn" onclick="window.print()">打印 / 导出 PDF</button>
    <a class="btn ghost" href="feed-cart-drawings.html">50 头产品图纸</a>
    <a class="btn ghost" href="feed-cart-p10-3d.html">P10 3D 演示</a>
    <a class="btn ghost" href="p10-loading-3d.html">装料 3D</a>
  </div>

  <main>
    <section class="sheet"><img src="drawings/p10-01a-general.svg" alt="FC-P10-01 总图"></section>
    <div class="cap"><span>FC-P10-01A 总图 · 三视图 / P10-P50 对比 / 参数</span><span>第 1 / 3 张</span></div>

    <section class="sheet"><img src="drawings/p10-02a-chassis.svg" alt="FC-P10-02 卸料与底盘"></section>
    <div class="cap"><span>FC-P10-02A 卸料与底盘 · B-B / A-A / 轴荷 / 成本</span><span>第 2 / 3 张</span></div>

    <section class="sheet"><img src="drawings/p10-04-full-discharge.svg" alt="FC-P10-03A 全宽卸料方案"></section>
    <div class="cap"><span>FC-P10-03A 全宽卸料方案 · C 现状 / A 单带下置 / B 后横送</span><span>第 3 / 4 张</span></div>

    <section class="sheet"><img src="drawings/p10-05-controller.svg" alt="FC-P10-05 控制器架构"></section>
    <div class="cap"><span>FC-P10-05 控制器架构 · 电源 / 安全链 / 主控 / 外设</span><span>第 4 / 4 张</span></div>
  </main>
</body>
</html>
