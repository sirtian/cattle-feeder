<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><title>P10-A 称重基准与比率激励</title><style>
        text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;}
        .vis{stroke:#1f2933;stroke-width:0.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
        .med{stroke:#33434f;stroke-width:0.32;fill:none;stroke-linecap:round;stroke-linejoin:round;}
        .thin{stroke:#4c5d69;stroke-width:0.22;fill:none;stroke-linecap:round;stroke-linejoin:round;}
        .hid{stroke:#8b99a3;stroke-width:0.2;stroke-dasharray:1.6 0.9;fill:none;}
        .cen{stroke:#b04a3a;stroke-width:0.18;stroke-dasharray:4 1 0.8 1;fill:none;}
        .phantom{stroke:#8b99a3;stroke-width:0.2;stroke-dasharray:3 1 0.8 1;fill:none;}
        .dim{stroke:#2d6b88;stroke-width:0.16;fill:none;}
        .dimext{stroke:#2d6b88;stroke-width:0.13;fill:none;}
        .leader{stroke:#2d6b88;stroke-width:0.16;fill:none;}
        .txt{fill:#1e2933;font-size:2.5px;}
        .dimtxt{fill:#245a75;font-size:2.25px;}
        .notetxt{fill:#33424d;font-size:2.2px;}
        .small{fill:#5b6b76;font-size:1.9px;}
        .viewtitle{fill:#1e2933;font-size:3.2px;font-weight:700;}
        .sheetno{fill:#1e2933;font-size:2.4px;font-weight:700;}
        .titlebig{fill:#15212a;font-size:5.4px;font-weight:700;}
        .red{fill:#a8452f;font-size:2.1px;}
        </style>
        <defs>
          <pattern id="hatch" width="1.7" height="1.7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="1.7" stroke="#8fa0aa" stroke-width="0.13"/>
          </pattern>
          <pattern id="hatch2" width="1.7" height="1.7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
            <line x1="0" y1="0" x2="0" y2="1.7" stroke="#9fb0ba" stroke-width="0.12"/>
          </pattern>
          <pattern id="straw" width="2.3" height="2.3" patternUnits="userSpaceOnUse">
            <rect width="2.3" height="2.3" fill="#f5e8d0"/>
            <path d="M0.3 0.6 l0.9 0.2 M1.3 1.7 l0.7 -0.3 M0.5 2.0 l0.5 0.2" stroke="#c49a5e" stroke-width="0.16"/>
          </pattern>
          <pattern id="conc" width="2.0" height="2.0" patternUnits="userSpaceOnUse">
            <rect width="2.0" height="2.0" fill="#f7edc9"/>
            <circle cx="0.6" cy="0.6" r="0.18" fill="#c9a33e"/>
            <circle cx="1.4" cy="1.5" r="0.16" fill="#d4b45a"/>
          </pattern>
          <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 z" fill="#2d6b88"/>
          </marker>
        </defs>
        <text x="14" y="18" class="viewtitle" text-anchor="start" style="font-size:4px;">P10-A 称重：2.5 V 基准 + 比率型激励（改板方案）</text><text x="14" y="24" class="small" text-anchor="start" style="font-size:1.8px;">EXC = 2 × VREF，二者同源于 REF5025；5 V 激励保持，VREF = 2.500 V。</text><rect x="16" y="38" width="40" height="14" class="med" style="fill:#f8fafb"/><text x="36" y="44.4" class="txt" text-anchor="middle" style="font-size:2.1px;">24V_P</text><text x="36" y="49.8" class="small" text-anchor="middle" style="font-size:1.5px;">来自 S1 母线</text><rect x="68" y="36" width="38" height="18" class="med" style="fill:#f8fafb"/><text x="87" y="44.4" class="txt" text-anchor="middle" style="font-size:1.8px;">U51 78L06</text><text x="87" y="51.8" class="small" text-anchor="middle" style="font-size:1.5px;">6 V / 100 mA</text><line x1="56" y1="45" x2="68" y2="45" class="med" /><polygon points="68,45 66.3,44.52 66.3,45.48" class="" style="fill:#2d6b88"/><line x1="106" y1="45" x2="128" y2="45" class="med" /><text x="112" y="43" class="small" text-anchor="start" style="font-size:1.6px;">6V</text><rect x="16" y="78" width="40" height="14" class="med" style="fill:#f8fafb"/><text x="36" y="84.4" class="txt" text-anchor="middle" style="font-size:2.1px;">5V</text><text x="36" y="89.8" class="small" text-anchor="middle" style="font-size:1.5px;">S1 buck 输出</text><rect x="68" y="76" width="38" height="18" class="med" style="fill:#f8fafb"/><text x="87" y="84.4" class="txt" text-anchor="middle" style="font-size:1.8px;">U50 REF5025</text><text x="87" y="91.8" class="small" text-anchor="middle" style="font-size:1.5px;">2.5 V / 3 ppm</text><line x1="56" y1="85" x2="68" y2="85" class="med" /><polygon points="68,85 66.3,84.52 66.3,85.48" class="" style="fill:#2d6b88"/><line x1="106" y1="85" x2="150" y2="85" class="med" /><text x="120" y="82.5" class="small" text-anchor="start" style="font-size:1.6px;">VREF = 2.500 V</text><circle cx="150" cy="85" r="1.2" class="vis" style="fill:#1f2933"/><polygon points="150,55 150,75 168,65" class="med" style="fill:#f2f6f8"/><text x="155" y="59" class="txt" text-anchor="middle" style="font-size:2.4px;">+</text><text x="155" y="73" class="txt" text-anchor="middle" style="font-size:2.4px;">−</text><line x1="150" y1="60" x2="132" y2="60" class="med" /><line x1="132" y1="60" x2="132" y2="85" class="med" /><line x1="132" y1="85" x2="150" y2="85" class="med" /><text x="176" y="66" class="small" text-anchor="start" style="font-size:1.6px;">U52A OPA2197</text><text x="176" y="69.5" class="small" text-anchor="start" style="font-size:1.4px;">（6V 供电）</text><line x1="168" y1="65" x2="186" y2="65" class="med" /><text x="172" y="63" class="small" text-anchor="start" style="font-size:1.4px;">R72 100Ω</text><circle cx="196" cy="60" r="4.5" class="med" fill="none"/><line x1="186" y1="65" x2="192" y2="62" class="med" /><text x="190" y="55" class="small" text-anchor="start" style="font-size:1.5px;">Q1 BC817</text><line x1="196" y1="55.5" x2="196" y2="45" class="med" /><line x1="196" y1="45" x2="150" y2="45" class="med" /><line x1="196" y1="64.5" x2="196" y2="78" class="med" /><text x="200" y="74" class="small" text-anchor="start" style="font-size:1.7px;">EXC_5V</text><circle cx="196" cy="78" r="1.2" class="vis" style="fill:#1f2933"/><line x1="196" y1="78" x2="214" y2="78" class="med" /><line x1="214" y1="78" x2="214" y2="70" class="med" /><line x1="214" y1="70" x2="168" y2="70" class="med" /><text x="218" y="75" class="small" text-anchor="start" style="font-size:1.4px;">R71 10k 0.1%</text><line x1="168" y1="70" x2="168" y2="86" class="med" /><line x1="168" y1="86" x2="178" y2="86" class="med" /><text x="180" y="87.5" class="small" text-anchor="start" style="font-size:1.4px;">R70 10k 0.1% → GND</text><line x1="168" y1="70" x2="168" y2="70" class="med" /><line x1="196" y1="78" x2="260" y2="78" class="med" /><text x="222" y="76" class="small" text-anchor="start" style="font-size:1.6px;">EXC_5V（84 mA）</text><line x1="260" y1="78" x2="260" y2="50" class="med" /><line x1="260" y1="50" x2="300" y2="50" class="med" /><rect x="300" y="40" width="86" height="34" class="med" style="fill:#f8fafb"/><text x="343" y="56.4" class="txt" text-anchor="middle" style="font-size:1.8px;">J30–J35 称重端子</text><text x="343" y="71.8" class="small" text-anchor="middle" style="font-size:1.5px;">1: EXC_5V  2: EXC_RET(GND)</text><polygon points="300,50 298.3,49.52 298.3,50.48" class="" style="fill:#2d6b88"/><line x1="150" y1="85" x2="300" y2="85" class="med" /><rect x="300" y="82" width="86" height="26" class="med" style="fill:#f8fafb"/><text x="343" y="94.4" class="txt" text-anchor="middle" style="font-size:1.7px;">U40 ADS1256</text><text x="343" y="105.8" class="small" text-anchor="middle" style="font-size:1.5px;">VREF pin4；C64 1µF + C65 100nF</text><polygon points="300,85 298.3,84.52 298.3,85.48" class="" style="fill:#2d6b88"/><text x="150" y="89" class="small" text-anchor="start" style="font-size:1.4px;">C82 1µF + C85 100nF</text><text x="128" y="40" class="small" text-anchor="start" style="font-size:1.4px;">C83 10µF + C84 100nF</text><text x="14" y="130" class="txt" text-anchor="start" style="font-size:2.2px;font-weight:bold;">接线与改板要点</text><text x="14" y="136" class="notetxt" text-anchor="start" style="font-size:1.55px;">1. J30–J35 的 1 脚由原 5V 改接 EXC_5V；2 脚（GND）作为 EXC_RET，单点回到 U50 的 GND（星型）。</text><text x="14" y="140.4" class="notetxt" text-anchor="start" style="font-size:1.55px;">2. VREF 由 REF5025 直接驱动 ADS1256 pin4，就近放 1µF+100nF；VREF 走线短、包地。</text><text x="14" y="144.8" class="notetxt" text-anchor="start" style="font-size:1.55px;">3. EXC_5V = 2 × VREF（R70 = R71 = 10k 0.1%）；5V 激励不变，负载仍为 2 mV/V → 10 mV 满量程。</text><text x="14" y="149.2" class="notetxt" text-anchor="start" style="font-size:1.55px;">4. 78L06 从 24V_P 取电（耗散约 0.36 W），给 U52 与 Q1 集电极；U52B 不用时输入接地、输出跟随。</text><text x="14" y="153.6" class="notetxt" text-anchor="start" style="font-size:1.55px;">5. 布局：REF/OPA/Q1 靠近 ADS1256 与称重端子，远离继电器、RS485、电机线；模拟地单点连接。</text><text x="14" y="158" class="notetxt" text-anchor="start" style="font-size:1.55px;">6. 误差预算：REF5025 0.05% + 0.1% 电阻 → 比率误差 &lt;0.25%，可通过五点标定消除；温漂 3 ppm/°C。</text><text x="14" y="170" class="txt" text-anchor="start" style="font-size:2.2px;font-weight:bold;">器件选型（新增）</text><text x="16" y="176" class="small" text-anchor="start" style="font-size:1.6px;font-weight:bold;">位号</text><text x="52" y="176" class="small" text-anchor="start" style="font-size:1.6px;font-weight:bold;">型号</text><text x="110" y="176" class="small" text-anchor="start" style="font-size:1.6px;font-weight:bold;">说明</text><text x="16" y="180.6" class="small" text-anchor="start" style="font-size:1.55px;">U50</text><text x="52" y="180.6" class="small" text-anchor="start" style="font-size:1.55px;">REF5025AIDR</text><text x="110" y="180.6" class="small" text-anchor="start" style="font-size:1.55px;">2.5V 基准，3ppm/°C，SOIC-8</text><text x="16" y="185.2" class="small" text-anchor="start" style="font-size:1.55px;">U51</text><text x="52" y="185.2" class="small" text-anchor="start" style="font-size:1.55px;">78L06</text><text x="110" y="185.2" class="small" text-anchor="start" style="font-size:1.55px;">6V/100mA LDO，SOT-89，24V 输入</text><text x="16" y="189.8" class="small" text-anchor="start" style="font-size:1.55px;">U52</text><text x="52" y="189.8" class="small" text-anchor="start" style="font-size:1.55px;">OPA2197IDR</text><text x="110" y="189.8" class="small" text-anchor="start" style="font-size:1.55px;">双运放，36V，精密，SOIC-8（6V 供电）</text><text x="16" y="194.4" class="small" text-anchor="start" style="font-size:1.55px;">Q1</text><text x="52" y="194.4" class="small" text-anchor="start" style="font-size:1.55px;">BC817-40</text><text x="110" y="194.4" class="small" text-anchor="start" style="font-size:1.55px;">NPN 500mA，SOT-23，EXC 缓冲</text><text x="16" y="199" class="small" text-anchor="start" style="font-size:1.55px;">R70/R71</text><text x="52" y="199" class="small" text-anchor="start" style="font-size:1.55px;">10k 0.1% 0603</text><text x="110" y="199" class="small" text-anchor="start" style="font-size:1.55px;">增益 2，决定 EXC/VREF 比率</text><text x="16" y="203.6" class="small" text-anchor="start" style="font-size:1.55px;">R72</text><text x="52" y="203.6" class="small" text-anchor="start" style="font-size:1.55px;">100Ω 0603</text><text x="110" y="203.6" class="small" text-anchor="start" style="font-size:1.55px;">Q1 基极限流</text><text x="16" y="208.2" class="small" text-anchor="start" style="font-size:1.55px;">C80/C83</text><text x="52" y="208.2" class="small" text-anchor="start" style="font-size:1.55px;">10µF/16V 0805</text><text x="110" y="208.2" class="small" text-anchor="start" style="font-size:1.55px;">EXC / 6V 储能</text><text x="16" y="212.8" class="small" text-anchor="start" style="font-size:1.55px;">C81/C82/C84/C85</text><text x="52" y="212.8" class="small" text-anchor="start" style="font-size:1.55px;">100nF/1µF 0603</text><text x="110" y="212.8" class="small" text-anchor="start" style="font-size:1.55px;">VREF、EXC、6V 去耦</text><rect x="8" y="8" width="404" height="281" class="med" fill="none"/><rect x="282" y="251" width="122" height="38" class="med" fill="none"/><line x1="282" y1="259" x2="404" y2="259" class="thin" /><line x1="282" y1="273" x2="404" y2="273" class="thin" /><line x1="282" y1="281" x2="404" y2="281" class="thin" /><line x1="344" y1="273" x2="344" y2="289" class="thin" /><line x1="374" y1="273" x2="374" y2="289" class="thin" /><text x="284" y="256.6" class="txt" text-anchor="start" style="font-size:2.3px;">智能养牛 · 10 头原型验证</text><text x="402" y="256.6" class="red" text-anchor="end" style="font-size:1.9px;">方案设计 · 待改板验证</text><text x="343" y="268.5" class="titlebig" text-anchor="middle" style="font-size:4.7px;">称重基准与比率激励改板</text><text x="284" y="278" class="txt" text-anchor="start" style="font-size:2.1px;">图号 FC-P10-06</text><text x="346" y="278" class="txt" text-anchor="start" style="font-size:2.1px;">比例 —</text><text x="376" y="278" class="txt" text-anchor="start" style="font-size:2.1px;">日期 2026-11-16</text><text x="284" y="286" class="txt" text-anchor="start" style="font-size:2.1px;">设计 项目组</text><text x="346" y="286" class="txt" text-anchor="start" style="font-size:2.1px;">审核 —</text><text x="376" y="286" class="txt" text-anchor="start" style="font-size:2.1px;">版本 A</text><text x="402" y="286" class="txt" text-anchor="end" style="font-size:2.1px;">第 1/1 页</text><text x="12" y="14.5" class="sheetno" text-anchor="start" style="">远程控制投料车</text><text x="408" y="14.5" class="small" text-anchor="end" style="">单位 mm · 第一角投影</text></svg>