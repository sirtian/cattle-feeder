        <text x="15" y="20" class="viewtitle" text-anchor="start" style="font-size:3.4px;">全宽卸料：为什么选 A（单带下置 + 全宽后门）</text><text x="15" y="24" class="small" text-anchor="start" style="font-size:1.8px;">现状是纵向链板 + 侧壁门：链板只沿 -X 推，没有 +Z 分量；远离门的 -Z 侧是死区。</text><rect x="17.5" y="47.5" width="107.08" height="65" class="med" fill="none"/><rect x="17.5" y="47.5" width="107.08" height="30.83" class="" style="fill:#f6ddd5"/><line x1="20" y1="49.17" x2="20" y2="110.83" class="thin" /><line x1="27.5" y1="49.17" x2="27.5" y2="110.83" class="thin" /><line x1="35" y1="49.17" x2="35" y2="110.83" class="thin" /><line x1="42.5" y1="49.17" x2="42.5" y2="110.83" class="thin" /><line x1="50" y1="49.17" x2="50" y2="110.83" class="thin" /><line x1="57.5" y1="49.17" x2="57.5" y2="110.83" class="thin" /><line x1="65" y1="49.17" x2="65" y2="110.83" class="thin" /><line x1="72.5" y1="49.17" x2="72.5" y2="110.83" class="thin" /><line x1="80" y1="49.17" x2="80" y2="110.83" class="thin" /><line x1="87.5" y1="49.17" x2="87.5" y2="110.83" class="thin" /><line x1="95" y1="49.17" x2="95" y2="110.83" class="thin" /><line x1="102.5" y1="49.17" x2="102.5" y2="110.83" class="thin" /><line x1="110" y1="49.17" x2="110" y2="110.83" class="thin" /><line x1="117.5" y1="49.17" x2="117.5" y2="110.83" class="thin" /><line x1="109.17" y1="62.5" x2="100" y2="62.5" class="vis" /><polygon points="100,62.5 101.7,62.02 101.7,62.98" class="" style="fill:#2d6b88"/><line x1="109.17" y1="80" x2="100" y2="80" class="vis" /><polygon points="100,80 101.7,79.52 101.7,80.48" class="" style="fill:#2d6b88"/><line x1="109.17" y1="97.5" x2="100" y2="97.5" class="vis" /><polygon points="100,97.5 101.7,97.02 101.7,97.98" class="" style="fill:#2d6b88"/><rect x="17.5" y="112.5" width="33.33" height="1.25" class="med" style="fill:#f7e6d2"/><rect x="17.5" y="115.83" width="33.33" height="14.17" class="med" style="fill:#e3f1ef"/><line x1="23.33" y1="111.67" x2="23.33" y2="117.92" class="leader" /><polygon points="23.33,117.92 22.85,116.22 23.81,116.22" class="" style="fill:#2d6b88"/><line x1="30" y1="111.67" x2="30" y2="117.92" class="leader" /><polygon points="30,117.92 29.52,116.22 30.48,116.22" class="" style="fill:#2d6b88"/><line x1="36.67" y1="111.67" x2="36.67" y2="117.92" class="leader" /><polygon points="36.67,117.92 36.19,116.22 37.15,116.22" class="" style="fill:#2d6b88"/><line x1="43.33" y1="111.67" x2="43.33" y2="117.92" class="leader" /><polygon points="43.33,117.92 42.85,116.22 43.81,116.22" class="" style="fill:#2d6b88"/><text x="35.83" y="62.08" class="txt" text-anchor="middle" style="font-size:1.9px;">死区 25–40%</text><rect x="137.5" y="47.5" width="107.08" height="65" class="med" fill="none"/><line x1="140" y1="49.17" x2="140" y2="110.83" class="thin" /><line x1="147.5" y1="49.17" x2="147.5" y2="110.83" class="thin" /><line x1="155" y1="49.17" x2="155" y2="110.83" class="thin" /><line x1="162.5" y1="49.17" x2="162.5" y2="110.83" class="thin" /><line x1="170" y1="49.17" x2="170" y2="110.83" class="thin" /><line x1="177.5" y1="49.17" x2="177.5" y2="110.83" class="thin" /><line x1="185" y1="49.17" x2="185" y2="110.83" class="thin" /><line x1="192.5" y1="49.17" x2="192.5" y2="110.83" class="thin" /><line x1="200" y1="49.17" x2="200" y2="110.83" class="thin" /><line x1="207.5" y1="49.17" x2="207.5" y2="110.83" class="thin" /><line x1="215" y1="49.17" x2="215" y2="110.83" class="thin" /><line x1="222.5" y1="49.17" x2="222.5" y2="110.83" class="thin" /><line x1="230" y1="49.17" x2="230" y2="110.83" class="thin" /><line x1="237.5" y1="49.17" x2="237.5" y2="110.83" class="thin" /><line x1="229.17" y1="62.5" x2="220" y2="62.5" class="vis" /><polygon points="220,62.5 221.7,62.02 221.7,62.98" class="" style="fill:#2d6b88"/><line x1="229.17" y1="80" x2="220" y2="80" class="vis" /><polygon points="220,80 221.7,79.52 221.7,80.48" class="" style="fill:#2d6b88"/><line x1="229.17" y1="97.5" x2="220" y2="97.5" class="vis" /><polygon points="220,97.5 221.7,97.02 221.7,97.98" class="" style="fill:#2d6b88"/><rect x="137.5" y="47.5" width="33.33" height="82.5" class="med" style="fill:#e3f1ef"/><line x1="170.83" y1="47.5" x2="170.83" y2="112.5" class="vis" /><line x1="170.83" y1="47.5" x2="170.83" y2="112.5" class="vis" /><line x1="143.33" y1="55" x2="143.33" y2="123.33" class="vis" /><polygon points="143.33,123.33 142.85,121.63 143.81,121.63" class="" style="fill:#2d6b88"/><line x1="150" y1="55" x2="150" y2="123.33" class="vis" /><polygon points="150,123.33 149.52,121.63 150.48,121.63" class="" style="fill:#2d6b88"/><line x1="156.67" y1="55" x2="156.67" y2="123.33" class="vis" /><polygon points="156.67,123.33 156.19,121.63 157.15,121.63" class="" style="fill:#2d6b88"/><line x1="163.33" y1="55" x2="163.33" y2="123.33" class="vis" /><polygon points="163.33,123.33 162.85,121.63 163.81,121.63" class="" style="fill:#2d6b88"/><rect x="257.5" y="47.5" width="107.08" height="65" class="med" fill="none"/><line x1="260" y1="49.17" x2="260" y2="110.83" class="thin" /><line x1="267.5" y1="49.17" x2="267.5" y2="110.83" class="thin" /><line x1="275" y1="49.17" x2="275" y2="110.83" class="thin" /><line x1="282.5" y1="49.17" x2="282.5" y2="110.83" class="thin" /><line x1="290" y1="49.17" x2="290" y2="110.83" class="thin" /><line x1="297.5" y1="49.17" x2="297.5" y2="110.83" class="thin" /><line x1="305" y1="49.17" x2="305" y2="110.83" class="thin" /><line x1="312.5" y1="49.17" x2="312.5" y2="110.83" class="thin" /><line x1="320" y1="49.17" x2="320" y2="110.83" class="thin" /><line x1="327.5" y1="49.17" x2="327.5" y2="110.83" class="thin" /><line x1="335" y1="49.17" x2="335" y2="110.83" class="thin" /><line x1="342.5" y1="49.17" x2="342.5" y2="110.83" class="thin" /><line x1="350" y1="49.17" x2="350" y2="110.83" class="thin" /><line x1="357.5" y1="49.17" x2="357.5" y2="110.83" class="thin" /><line x1="349.17" y1="62.5" x2="340" y2="62.5" class="vis" /><polygon points="340,62.5 341.7,62.02 341.7,62.98" class="" style="fill:#2d6b88"/><line x1="349.17" y1="80" x2="340" y2="80" class="vis" /><polygon points="340,80 341.7,79.52 341.7,80.48" class="" style="fill:#2d6b88"/><line x1="349.17" y1="97.5" x2="340" y2="97.5" class="vis" /><polygon points="340,97.5 341.7,97.02 341.7,97.98" class="" style="fill:#2d6b88"/><rect x="257.5" y="47.5" width="33.33" height="65" class="med" style="fill:#e3f1ef"/><line x1="263.33" y1="51.67" x2="263.33" y2="108.33" class="vis" /><polygon points="263.33,108.33 262.85,106.63 263.81,106.63" class="" style="fill:#2d6b88"/><line x1="270" y1="51.67" x2="270" y2="108.33" class="vis" /><polygon points="270,108.33 269.52,106.63 270.48,106.63" class="" style="fill:#2d6b88"/><line x1="276.67" y1="51.67" x2="276.67" y2="108.33" class="vis" /><polygon points="276.67,108.33 276.19,106.63 277.15,106.63" class="" style="fill:#2d6b88"/><line x1="283.33" y1="51.67" x2="283.33" y2="108.33" class="vis" /><polygon points="283.33,108.33 282.85,106.63 283.81,106.63" class="" style="fill:#2d6b88"/><rect x="257.5" y="112.5" width="33.33" height="1.25" class="med" style="fill:#f7e6d2"/><rect x="257.5" y="115.83" width="33.33" height="14.17" class="med" style="fill:#e3f1ef"/><text x="17.5" y="41" class="txt" text-anchor="start" style="font-size:2.1px;font-weight:bold;">C 现状：纵向链板 + 侧门</text><text x="137.5" y="41" class="txt" text-anchor="start" style="font-size:2.1px;font-weight:bold;">A 单带下置 + 全宽后门（已选）</text><text x="257.5" y="41" class="txt" text-anchor="start" style="font-size:2.1px;font-weight:bold;">B 后横送 + 现有侧门</text><text x="17.5" y="136" class="small" text-anchor="start" style="font-size:1.35px;">料只沿 X 走，门只开在 +Z 壁</text><text x="137.5" y="136" class="small" text-anchor="start" style="font-size:1.35px;">带尾 z=-390；x=-50 全宽门</text><text x="257.5" y="136" class="small" text-anchor="start" style="font-size:1.35px;">横送把 -Z 料送到 +Z 门；箱容保留</text><text x="15" y="150" class="txt" text-anchor="start" style="font-size:2.1px;font-weight:bold;">为什么 C 不能全出</text><text x="15" y="156" class="notetxt" text-anchor="start" style="font-size:1.55px;">1. 链板刮板横跨箱宽、沿 -X 运动，没有 +Z 分量；</text><text x="15" y="160.6" class="notetxt" text-anchor="start" style="font-size:1.55px;">   料只能被推到后壁，不能横移到 +Z 侧门。</text><text x="15" y="165.2" class="notetxt" text-anchor="start" style="font-size:1.55px;">2. 门是 +Z 壁上的 400×180 洞，只能取 +Z 边界层；</text><text x="15" y="169.8" class="notetxt" text-anchor="start" style="font-size:1.55px;">   5 cm 秸秆休止角约 45°，跨 390 宽差要 390 高差，</text><text x="15" y="174.4" class="notetxt" text-anchor="start" style="font-size:1.55px;">   箱高 900、门洞 500–680，-Z 侧后角料翻不过去。</text><text x="15" y="179" class="notetxt" text-anchor="start" style="font-size:1.55px;">3. 估算残留 25–40%，且混入下一车；15 天无人不可接受。</text><text x="15" y="183.6" class="notetxt" text-anchor="start" style="font-size:1.55px;">   必须做 1:1 透明试验段实测，不能只靠估算。</text><text x="200" y="150" class="txt" text-anchor="start" style="font-size:2.1px;font-weight:bold;">A / B 对比</text><rect x="200" y="155" width="180" height="24.8" class="med" fill="none"/><rect x="200" y="155" width="180" height="6.2" class="" style="fill:#e9eff3"/><line x1="200" y1="155" x2="200" y2="179.8" class="thin" /><text x="201.2" y="159.34" class="txt" text-anchor="start" style="font-size:1.45px;">方案</text><line x1="236" y1="155" x2="236" y2="179.8" class="thin" /><text x="237.2" y="159.34" class="txt" text-anchor="start" style="font-size:1.45px;">残留</text><line x1="260" y1="155" x2="260" y2="179.8" class="thin" /><text x="261.2" y="159.34" class="txt" text-anchor="start" style="font-size:1.45px;">箱容</text><line x1="304" y1="155" x2="304" y2="179.8" class="thin" /><text x="305.2" y="159.34" class="txt" text-anchor="start" style="font-size:1.45px;">驱动</text><line x1="328" y1="155" x2="328" y2="179.8" class="thin" /><text x="329.2" y="159.34" class="txt" text-anchor="start" style="font-size:1.45px;">改动</text><line x1="200" y1="161.2" x2="380" y2="161.2" class="thin" /><text x="201.2" y="165.54" class="notetxt" text-anchor="start" style="font-size:1.4px;">C 现状</text><text x="237.2" y="165.54" class="notetxt" text-anchor="start" style="font-size:1.4px;">25–40%</text><text x="261.2" y="165.54" class="notetxt" text-anchor="start" style="font-size:1.4px;">保留</text><text x="305.2" y="165.54" class="notetxt" text-anchor="start" style="font-size:1.4px;">1</text><text x="329.2" y="165.54" class="notetxt" text-anchor="start" style="font-size:1.4px;">—</text><line x1="200" y1="167.4" x2="380" y2="167.4" class="thin" /><text x="201.2" y="171.74" class="notetxt" text-anchor="start" style="font-size:1.4px;">A 单带下置</text><text x="237.2" y="171.74" class="notetxt" text-anchor="start" style="font-size:1.4px;">&lt;5%</text><text x="261.2" y="171.74" class="notetxt" text-anchor="start" style="font-size:1.4px;">后 400 损失</text><text x="305.2" y="171.74" class="notetxt" text-anchor="start" style="font-size:1.4px;">1</text><text x="329.2" y="171.74" class="notetxt" text-anchor="start" style="font-size:1.4px;">带加长、门改后</text><line x1="200" y1="173.6" x2="380" y2="173.6" class="thin" /><text x="201.2" y="177.94" class="notetxt" text-anchor="start" style="font-size:1.4px;">B 后横送</text><text x="237.2" y="177.94" class="notetxt" text-anchor="start" style="font-size:1.4px;">&lt;5%</text><text x="261.2" y="177.94" class="notetxt" text-anchor="start" style="font-size:1.4px;">保留</text><text x="305.2" y="177.94" class="notetxt" text-anchor="start" style="font-size:1.4px;">2</text><text x="329.2" y="177.94" class="notetxt" text-anchor="start" style="font-size:1.4px;">+横送、侧门保留</text><text x="200" y="186" class="txt" text-anchor="start" style="font-size:2.1px;font-weight:bold;">已选 A · 实施要点</text><text x="200" y="192" class="notetxt" text-anchor="start" style="font-size:1.5px;">P10 按 A 实施：400 宽带从 z=-390 水平穿到 z=430，</text><text x="200" y="196.5" class="notetxt" text-anchor="start" style="font-size:1.5px;">再 33° 抬升；全宽后门 780×180 计量。箱容 0.62 m³</text><text x="200" y="201" class="notetxt" text-anchor="start" style="font-size:1.5px;">（≈74 kg，10 头 1.6 天）；P50 若用 A，箱体加长</text><text x="200" y="205.5" class="notetxt" text-anchor="start" style="font-size:1.5px;">400 保 250 kg。先做 2 m 透明试验段测残留/搭桥。</text><rect x="8" y="8" width="404" height="281" class="med" fill="none"/><rect x="282" y="251" width="122" height="38" class="med" fill="none"/><line x1="282" y1="259" x2="404" y2="259" class="thin" /><line x1="282" y1="273" x2="404" y2="273" class="thin" /><line x1="282" y1="281" x2="404" y2="281" class="thin" /><line x1="344" y1="273" x2="344" y2="289" class="thin" /><line x1="374" y1="273" x2="374" y2="289" class="thin" /><text x="284" y="256.6" class="txt" text-anchor="start" style="font-size:2.3px;">智能养牛 · 10 头原型验证</text><text x="402" y="256.6" class="red" text-anchor="end" style="font-size:1.9px;">已选 A · 实施</text><text x="343" y="268.5" class="titlebig" text-anchor="middle" style="font-size:4.7px;">全宽卸料方案（已选 A）</text><text x="284" y="278" class="txt" text-anchor="start" style="font-size:2.1px;">图号 FC-P10-03A</text><text x="346" y="278" class="txt" text-anchor="start" style="font-size:2.1px;">比例 1:12</text><text x="376" y="278" class="txt" text-anchor="start" style="font-size:2.1px;">日期 2026-11-16</text><text x="284" y="286" class="txt" text-anchor="start" style="font-size:2.1px;">设计 项目组</text><text x="346" y="286" class="txt" text-anchor="start" style="font-size:2.1px;">审核 —</text><text x="376" y="286" class="txt" text-anchor="start" style="font-size:2.1px;">版本 A</text><text x="402" y="286" class="txt" text-anchor="end" style="font-size:2.1px;">第 3/3 页</text><text x="12" y="14.5" class="sheetno" text-anchor="start" style="">远程控制投料车</text><text x="408" y="14.5" class="small" text-anchor="end" style="">单位 mm · 第一角投影</text></svg>